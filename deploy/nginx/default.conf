# Config de nginx para el deploy containerizado (docker-compose.prod.yml, perfil
# "nginx"). Se monta en /etc/nginx/conf.d/, o sea que ya esta dentro del bloque http.
#
# No usa el dominio en ningun lado a proposito: el certificado se pide siempre con
# --cert-name connect, asi que la ruta es fija y esta config no necesita envsubst ni
# regenerarse si el dominio cambia. El dominio vive solo en .env.production.

# Next.js negocia un websocket en algunas rutas; sin este map, mandarle
# "Connection: upgrade" a un request normal rompe el keep-alive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Tiene que responder por HTTP plano: es como Let's Encrypt valida el dominio,
    # incluido en cada renovacion.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/connect/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/connect/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # Adjuntos de WhatsApp (audio, video, documentos): el default de nginx es 1m y
    # rebota los archivos grandes con un 413 antes de que el backend los vea.
    client_max_body_size 25m;

    # El DNS interno de Docker. Sin resolver, nginx resuelve los nombres de los
    # contenedores UNA sola vez al arrancar; al recrear el backend le cambia la IP y
    # todo /api/ queda en 502 hasta un reload manual — y la pagina igual carga,
    # porque eso lo sirve el frontend, asi que parece un bug de la app.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend netservice_backend:3001;
        proxy_pass http://$backend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Los eventos en vivo del panel van por SSE sobre esta misma ruta: con
        # buffering nginx los retiene hasta llenar el buffer y la bandeja no se
        # actualiza, y con el read_timeout default (60s) corta la conexion sola.
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        set $frontend netservice_frontend:3000;
        proxy_pass http://$frontend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }
}
