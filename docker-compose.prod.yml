# Deploy alternativo containerizado (para un servidor que ya usa Docker para otras
# apps, ej. un droplet compartido). El backend/frontend NO exponen puertos al host —
# los alcanza el nginx que ya esté corriendo en la máquina, agregándolo a esta misma
# red (`docker network connect netservice_default <contenedor-nginx>`) y haciéndole
# proxy_pass por nombre de contenedor. Ver DEPLOY-DOCKER.md.
#
# Uso: docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: netservice_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - netservice_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Reparte los eventos en vivo del panel (SSE) entre los procesos de la API. Sin esto
  # la API tiene que correr en UN solo proceso: los eventos se entregan en memoria y un
  # mensaje recibido por un worker no llegaria a los agentes conectados a otro.
  #
  # Sin persistencia a proposito: solo reparte mensajes en el momento, no guarda nada
  # que valga la pena sobrevivir a un reinicio. Tampoco expone puertos al host — vive
  # en la red interna de compose, que es lo que evita dejar un Redis abierto a internet.
  redis:
    image: redis:7-alpine
    container_name: netservice_redis
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: netservice_backend
    env_file: .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_URL: redis://redis:6379
    volumes:
      - netservice_media:/repo/apps/backend/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_BRAND_NAME: ${BRAND_NAME}
        NEXT_PUBLIC_BRAND_TAGLINE: ${BRAND_TAGLINE}
        NEXT_PUBLIC_ENABLE_NETSERVICE_PANEL: ${ENABLE_NETSERVICE_PANEL}
    container_name: netservice_frontend
    depends_on:
      - backend
    restart: unless-stopped

  # nginx + certbot viven detras del perfil "nginx" para no romper el droplet
  # compartido, donde los puertos 80/443 son de otra app y el proxy es ajeno. Ahi se
  # sigue levantando el stack sin perfil y estos dos servicios no se crean ni se
  # tocan; en un server dedicado se usa `--profile nginx`.
  nginx:
    image: nginx:1.27-alpine
    container_name: netservice_nginx
    profiles: ['nginx']
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - netservice_letsencrypt:/etc/letsencrypt
      - netservice_certbot_www:/var/www/certbot
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  # Renueva el certificado solo. Let's Encrypt dura 90 dias y `renew` no hace nada
  # hasta que faltan 30, asi que reintentar cada 12h es barato y deja margen de sobra
  # si el server estuvo caido. El certificado inicial NO lo pide este servicio: lo
  # pide deploy/init-letsencrypt.sh una sola vez (ver DEPLOY-DOCKER.md).
  certbot:
    image: certbot/certbot:latest
    container_name: netservice_certbot
    profiles: ['nginx']
    volumes:
      - netservice_letsencrypt:/etc/letsencrypt
      - netservice_certbot_www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done"
    restart: unless-stopped

volumes:
  netservice_postgres_data:
  netservice_media:
  netservice_letsencrypt:
  netservice_certbot_www:
